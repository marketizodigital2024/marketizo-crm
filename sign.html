<!doctype html>
<html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Marketizo Sign</title><link rel="stylesheet" href="sign.css?v=20261029-exact-pdf"><script defer src="sign.js?v=20261029-exact-pdf"></script></head>
<body><main><p id="message" role="status" aria-live="polite">Otvaramo dokument…</p><p id="pdfFallback" hidden><a id="downloadFallback" href="/api/sign-public?action=receipt" target="_blank" rel="noopener noreferrer">Preuzmi potpisani PDF</a></p><section id="agreement" class="paper" hidden>
<header><img src="marketizo-logo.png" alt="Marketizo Digital e.U."><p id="issuer"></p></header>
<ol id="signSteps" class="sign-steps" aria-label="Redosled potpisivanja"></ol><p id="readHint" class="read-hint" hidden></p><div class="document-actions"><button id="startSigning" type="button">Pređi na potpis</button></div>
<h1 id="title"></h1><section id="detailsSection" hidden><h2 id="detailsTitle">Podaci za ugovor</h2><p id="detailsHint"></p><form id="detailsForm"><div id="detailsFields" class="details-grid"></div><button id="completeDetails" type="submit">Potvrdi podatke i prikaži ugovor</button></form></section><p id="detailsWaiting" hidden></p><div id="documentPages" aria-busy="true"></div>
<section id="signatureSection" class="on-paper"><h2 id="signatureTitle">Vaš potpis</h2><label for="signerName" id="nameLabel">Ime i prezime</label><input id="signerName" maxlength="160" autocomplete="name"><p id="drawLabel">Nacrtajte potpis (opciono)</p><canvas id="signatureCanvas" width="720" height="180" aria-label="Površina za crtanje potpisa"></canvas><button id="clearSignature" class="text-button" type="button">Obriši potpis</button><button id="enlargeSignature" type="button" class="secondary">Uvećaj polje za potpis</button>
<div id="signatureActions"><label class="check"><input id="acceptTerms" type="checkbox"><span id="consentText"></span></label><p id="signatureHint" class="muted"></p><button id="acceptDocument" type="button" disabled>Potpiši dokument</button></div></section>
<section id="acceptedSection" hidden><h2 id="acceptedTitle"></h2><p id="completionMessage"></p><div id="receiptLinks" hidden><a id="downloadReceipt" class="button" href="/api/sign-public?action=receipt" target="_blank" rel="noopener noreferrer">Preuzmi potpisani PDF</a></div></section>
<footer>Marketizo Digital e.U.</footer></section><p class="privacy"><span id="privacyText"></span> <a id="privacyLink" href="/sign-privacy-20261020-link" target="_blank" rel="noopener noreferrer">Obaveštenje o privatnosti</a></p></main>
<dialog id="signatureDialog"><h2 id="dialogTitle">Vaš potpis</h2><canvas id="largeSignatureCanvas" width="720" height="180" aria-label="Uvećana površina za crtanje potpisa"></canvas><button id="clearLargeSignature" type="button" class="text-button">Obriši potpis</button><button id="closeSignatureDialog" type="button">Gotovo</button></dialog></body></html>
