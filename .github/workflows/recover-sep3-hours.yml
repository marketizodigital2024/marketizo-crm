name: Recover Sep 3 employee hours

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-sep3-hours.yml'
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Recover missing Sep 3 hours
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS "https://app.marketizo.com/api/state?recover=sep3-c520d333d0718f97" || true)
            echo "$body"
            if echo "$body" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
